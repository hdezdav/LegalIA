    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="Legalia · Respuestas jurídicas verificables" />

      property="og:description"
      content="Consultas jurídicas respaldadas por fuentes oficiales del derecho colombiano. Cada respuesta cita su fuente."

    <meta name="twitter:card" content="summary_large_image" />

      content="Consultas jurídicas respaldadas por fuentes oficiales del derecho colombiano."

    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Fonts: the app UI (index.css) uses Plus Jakarta Sans; the landing uses
         system fonts and needs none of these. -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/legalia-icon.svg" />

    <!-- Structured data: what this is, who runs it, what it costs -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://legalia.co/#organization",
            "name": "Legalia",
            "url": "https://legalia.co/",
            "logo": "https://legalia.co/assets/legalia-icon.svg",
            "areaServed": {
              "@type": "Country",
              "name": "Colombia"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://legalia.co/#website",
            "url": "https://legalia.co/",
            "name": "Legalia",
            "inLanguage": "es-CO",
            "publisher": { "@id": "https://legalia.co/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "name": "Legalia",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "inLanguage": "es-CO",
            "description": "Asistente de consultas jurídicas sobre el ordenamiento colombiano. Cada respuesta se fundamenta en fuentes oficiales verificables y cita el documento de origen.",
            "publisher": { "@id": "https://legalia.co/#organization" },
            "offers": [
              {
                "@type": "Offer",
                "name": "Gratuito",
                "price": "0",
                "priceCurrency": "COP",
                "description": "10 consultas diarias, 8 especialidades básicas, historial de 7 días."
              },
              {
                "@type": "Offer",
                "name": "Profesional",
                "price": "89000",
                "priceCurrency": "COP",
                "description": "Consultas ilimitadas, corpus completo, asistentes personalizados y exportación."
              },
              {
                "@type": "Offer",
                "name": "Despachos",
                "price": "249000",
                "priceCurrency": "COP",
                "description": "Hasta 5 licencias, expedientes privados, gestión de equipos y facturación DIAN."
              }
            ]
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "¿Por qué Legalia no inventa jurisprudencia?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Legalia solo responde con información extraída del corpus legal colombiano. Si no hay evidencia en las fuentes oficiales, no hay respuesta."
                }
              },
              {
                "@type": "Question",
                "name": "¿El corpus está actualizado?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sí. Incluye sentencias y normativa de la Corte Constitucional, Corte Suprema, Consejo de Estado, DIAN y otras fuentes oficiales."
                }
              },
              {
                "@type": "Question",
                "name": "¿Quién es el dueño de los documentos que genero?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Tú. Retienes el 100% de los derechos sobre cualquier documento creado en la plataforma."
                }
              },
              {
                "@type": "Question",
                "name": "¿Usan mis consultas para entrenar modelos?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Tu información nunca se usa para entrenar modelos ni se comparte con terceros. Cumplimos con la Ley 1581 de 2012."
                }
              },
              {
                "@type": "Question",
                "name": "¿Emiten factura electrónica?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sí. Todos los pagos generan factura electrónica válida ante la DIAN con IVA discriminado."
                }
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
