<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <!-- Clean Minimalist Light Card / Rounded Base -->
  <rect width="200" height="200" rx="44" fill="#FFFFFF" />
  <rect x="2" y="2" width="196" height="196" rx="42" fill="none" stroke="#E2E8F0" stroke-width="2.5" />

  <!-- Minimalist Scales of Justice Pillar -->
  <path d="M 100 44 L 100 152" stroke="url(#primaryGrad)" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Sleek Minimalist Base -->
  <path d="M 76 152 L 124 152" stroke="url(#primaryGrad)" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 68 160 L 132 160" stroke="url(#goldAccent)" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Minimalist Diamond Apex -->
  <polygon points="100,34 107,44 100,54 93,44" fill="url(#goldAccent)" />

  <!-- Minimalist Crossbeam -->
  <path d="M 54 68 Q 100 62 146 68" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Left Scale Pan -->
  <line x1="54" y1="68" x2="42" y2="102" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" />
  <line x1="54" y1="68" x2="66" y2="102" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 36 102 Q 54 116 72 102 Z" fill="url(#goldAccent)" />

  <!-- Right Scale Pan -->
  <line x1="146" y1="68" x2="134" y2="102" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" />
  <line x1="146" y1="68" x2="158" y2="102" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 128 102 Q 146 116 164 102 Z" fill="url(#goldAccent)" />

  <!-- Minimal AI Neural Nodes -->
  <circle cx="54" cy="68" r="3.5" fill="#0284C7" />
  <circle cx="146" cy="68" r="3.5" fill="#0284C7" />
  <circle cx="100" cy="95" r="4" fill="#0284C7" />
  <circle cx="100" cy="124" r="3" fill="#0284C7" />
  
  <!-- Subtle Minimal Connectors -->
  <line x1="54" y1="68" x2="100" y2="95" stroke="#0284C7" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.45" />
  <line x1="146" y1="68" x2="100" y2="95" stroke="#0284C7" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.45" />
</svg>
