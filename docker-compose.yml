# =============================================================================
# LegalIA - MVP stack
# =============================================================================
# Networks:
#   edge     -> Caddy + the two HTTP surfaces it fronts (API, Frontend)
#   internal -> data stores. Marked `internal: true`, so PostgreSQL
#               has NO route to the internet and no published ports.
#
# Nothing but Caddy publishes a host port. PostgreSQL is reachable only from
# legalia-api.
# =============================================================================

name: legalia

services:
  # ---------------------------------------------------------------------------
  # Reverse proxy / TLS termination
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    container_name: legalia-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      - legalia-api
      - legalia-frontend

  # ---------------------------------------------------------------------------
  # LegalIA API - all legal logic (retrieval, reranking, citations, verification)
  # ---------------------------------------------------------------------------
  legalia-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: legalia-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Force the in-network hostname regardless of what .env says, so a value
      # copied from a host-side shell cannot point the API at the wrong place.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      # Live app code mount for development
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./scripts:/app/scripts:ro
      # Read-only corpus mount: ingestion reads source documents from the host
      # without the container being able to modify them.
      - ./corpus:/app/corpus:ro
      - ./evaluation/results:/app/evaluation/results
    networks:
      - edge
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ---------------------------------------------------------------------------
  # PostgreSQL + pgvector - LegalIA's own store. Never exposed publicly.
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: legalia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legalia}
      POSTGRES_USER: ${POSTGRES_USER:-legalia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Spanish-aware defaults for full-text search and collation.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legalia} -d ${POSTGRES_DB:-legalia}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ---------------------------------------------------------------------------
  # LegalIA Frontend - Real-time Vite Dev Server with Live Reload (HMR)
  # ---------------------------------------------------------------------------
  legalia-frontend:
    image: node:20-alpine
    container_name: legalia-frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - VITE_API_URL=http://legalia-api:8000
    networks:
      - edge
    depends_on:
      - legalia-api

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
