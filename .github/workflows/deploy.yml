name: Deploy to Production VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS (166.1.88.122)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate SSH credentials
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_PASS: ${{ secrets.VPS_PASS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$VPS_PASSWORD$VPS_PASS$VPS_SSH_KEY$SSH_PRIVATE_KEY" ]; then
            echo "::error::Missing SSH credentials. Configure at least one of: VPS_PASSWORD, VPS_PASS, VPS_SSH_KEY, SSH_PRIVATE_KEY."
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 166.1.88.122
          username: root
          password: ${{ secrets.VPS_PASSWORD || secrets.VPS_PASS }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "🚀 Actualizando LegalIA en el VPS..."
            cd /opt/legalia

            # Sync or pull latest changes
            if [ -d ".git" ]; then
              git fetch origin main
              git reset --hard origin/main
            fi

            # Rebuild and restart services
            docker compose -f docker-compose.prod.yml build legalia-frontend legalia-api
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Run database migrations
            docker compose -f docker-compose.prod.yml exec -T legalia-api alembic upgrade head || true

            # Healthcheck with retry loop
            echo "⏳ Verificando disponibilidad de la API..."
            for i in {1..10}; do
              if curl -fsS http://localhost/api/v1/health > /dev/null 2>&1; then
                echo "✅ API saludable y respondiendo."
                break
              fi
              echo "Intento $i/10 falló, reintentando en 3s..."
              sleep 3
            done

            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            curl -fsS http://localhost/api/v1/health || { echo "❌ Falló el healthcheck de producción"; exit 1; }

            # Clean dangling docker images to save disk space
            docker image prune -f

            echo "✅ Despliegue completado con éxito."
